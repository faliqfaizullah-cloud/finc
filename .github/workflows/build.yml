name: Build F.INC
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            errs=$(grep -E "^e: |What went wrong|error:|Execution failed|Could not|Unresolved|AAPT" -A3 build.log | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=BUILD ERRORS::$errs"
          fi
          exit $code
      - run: cp app/build/outputs/apk/release/app-release.apk F.INC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: F.INC
          path: F.INC.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: F.INC.apk
